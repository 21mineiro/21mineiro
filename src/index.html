<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desafios">
  <title>Desafios &amp; Treinos</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="description" content="Desafios com amigos e treino do dia.">
  <meta property="og:title" content="Desafios &amp; Treinos">
  <meta property="og:description" content="Desafios com amigos e treino do dia.">
  <meta property="og:image" content="https://desafios-treinos.netlify.app/og.png">
  <meta property="og:url" content="https://desafios-treinos.netlify.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <div class="top-text">
      <p id="hello" class="eyebrow"></p>
      <h1 id="title">Hoje</h1>
    </div>
    <span id="today" class="date-pill"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Seções">
    <button data-tab="hoje" class="active" aria-label="Hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <span>Hoje</span>
    </button>
    <button data-tab="desafios" aria-label="Desafios">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4.5v1.5A3.5 3.5 0 0 0 8 11M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11M12 13.5V17M8.5 20.5h7M9.5 17h5v3.5h-5z"/></svg>
      <span>Desafios</span>
    </button>
    <button data-tab="treinos" aria-label="Treinos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11"/><rect x="5" y="6" width="3" height="12" rx="1.2"/><rect x="16" y="6" width="3" height="12" rx="1.2"/></svg>
      <span>Treinos</span>
    </button>
    <button data-tab="alunos" aria-label="Alunos" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5a6 6 0 0 1 12 0"/><circle cx="16.8" cy="9.5" r="2.6"/><path d="M15.5 14.2a5 5 0 0 1 5.5 5.3"/></svg>
      <span>Alunos</span>
    </button>
    <button data-tab="perfil" aria-label="Perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
      <span>Perfil</span>
    </button>
  </nav>

  <div id="tip" class="viz-tip" role="tooltip" hidden></div>
  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
